name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Generate synthetic dataset
        run: python -m synth.generator --out ../data/synthetic
      - name: Eval (offline arm, held-out test split)
        run: |
          python -m evals.run_eval --split dev
          python -m evals.run_eval --split test | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail if precision regresses (no false accusations)
        run: |
          python -c "import json,sys; r=json.load(open('evals/results/test_hybrid_heuristic.json')); p=r['detection']['overall']['precision']; print('precision',p); sys.exit(p < 99.0)"
      - uses: actions/upload-artifact@v4
        with: { name: eval-results, path: backend/evals/results }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
